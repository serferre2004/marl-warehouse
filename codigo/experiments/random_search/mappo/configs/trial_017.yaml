name: mappo_random_trial_017
algorithm: mappo
seed: 3
time_limit: 500
training:
  timesteps: 15000000
environment:
  key: rware:rware
  scenario: tiny
  n_agents: 2
  request_queue_size: 2
  sensor_range: 1
  msg_bits: 0
  reward_type: THREE_STAGE
  observation_type: FLATTENED
reward:
  common: true
  scalarisation: sum
evaluation:
  enabled: true
  interval: 100000
  episodes: 100
logging:
  runner_interval: 4000
  learner_interval: 4000
  general_interval: 4000
checkpoint:
  save: true
  interval: 1000000
results:
  path: experiments/random_search/mappo/results/trial_017
agent: rnn
hidden_dim: 64
obs_agent_id: true
obs_last_action: false
gamma: 0.95
batch_size: 32
batch_size_run: 8
buffer_size: 32
lr: 0.00041845707465983415
optim_alpha: 0.99
optim_eps: 1.0e-05
grad_norm_clip: 10
add_value_last_step: true
entropy_coef: 0.0054058797411845215
action_selector: soft_policies
mask_before_softmax: true
runner: parallel
target_update_interval_or_tau: 0.05
agent_output_type: pi_logits
learner: ppo_learner
standardise_returns: false
standardise_rewards: true
use_rnn: true
q_nstep: 5
critic_type: cv_critic
obs_individual_obs: false
epochs: 4
eps_clip: 0.1
