name: ippo_random_trial_019
algorithm: ippo
seed: 22
time_limit: 500
training:
  timesteps: 15000000
environment:
  key: rware:rware
  scenario: tiny
  n_agents: 2
  request_queue_size: 2
  sensor_range: 1
  msg_bits: 0
  reward_type: THREE_STAGE
  observation_type: FLATTENED
reward:
  common: true
  scalarisation: sum
evaluation:
  enabled: true
  interval: 100000
  episodes: 100
logging:
  runner_interval: 4000
  learner_interval: 4000
  general_interval: 4000
checkpoint:
  save: true
  interval: 1000000
results:
  path: experiments/random_search/ippo/results
agent: rnn
hidden_dim: 64
obs_agent_id: true
obs_last_action: true
gamma: 0.99
batch_size: 16
batch_size_run: 32
buffer_size: 16
lr: 0.0023969444850799283
optim_alpha: 0.99
optim_eps: 1.0e-05
add_value_last_step: true
entropy_coef: 0.0022664653672747085
grad_norm_clip: 10
action_selector: soft_policies
mask_before_softmax: true
runner: parallel
target_update_interval_or_tau: 0.01
agent_output_type: pi_logits
learner: ppo_learner
standardise_returns: false
standardise_rewards: false
use_rnn: true
q_nstep: 5
critic_type: ac_critic
epochs: 6
eps_clip: 0.3
