name: ia2c_tiny_seed3

algorithm: ia2c
seed: 3
time_limit: 20000

training:
  timesteps: 20000000

environment:
  key: "rware:rware"
  scenario: tiny

  n_agents: 2
  request_queue_size: 2

  sensor_range: 1
  msg_bits: 0

  reward_type: GLOBAL
  observation_type: FLATTENED


reward:
  common: true
  scalarisation: "sum"

communication:


evaluation:
  enabled: true
  interval: 10000
  episodes: 10

logging:
  runner_interval: 4000
  learner_interval: 4000
  general_interval: 4000

checkpoint:
  save: true
  interval: 200000

results:
  path: experiments/results


# --- Agent parameters ---
agent: "rnn"
hidden_dim: 64 # Size of hidden state for default rnn agent
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation


# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 1024 # Size of the replay buffer
lr: 0.0005 # Learning rate for agents
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm
add_value_last_step: True
entropy_coef: 0.01


# --- IA2C NS specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

# update the target network every {} training steps
target_update_interval_or_tau: 200

agent_output_type: "pi_logits"
learner: "actor_critic_learner"
standardise_returns: False
standardise_rewards: True
use_rnn: False
q_nstep: 5 # 1 corresponds to normal r + gammaV
critic_type: "ac_critic_ns"
