name: mappo_small_seed3

algorithm: mappo
seed: 3
time_limit: 500

training:
  timesteps: 40000000

environment:
  key: rware:rware
  scenario: small

  n_agents: 4
  request_queue_size: 4

  sensor_range: 1
  msg_bits: 0

  reward_type: THREE_STAGE
  observation_type: FLATTENED

reward:
  common: true
  scalarisation: sum

evaluation:
  enabled: true
  interval: 100000
  episodes: 100

logging:
  runner_interval: 5000
  learner_interval: 5000
  general_interval: 5000

checkpoint:
  save: true
  interval: 5000000

results:
  path: experiments/results


agent: rnn
hidden_dim: 256
obs_agent_id: true
obs_last_action: false
obs_individual_obs: false


gamma: 0.95
batch_size: 10
batch_size_run: 10
buffer_size: 10
lr: 0.002
optim_alpha: 0.99
optim_eps: 1.0e-05
add_value_last_step: true
entropy_coef: 0.0028
grad_norm_clip: 5


action_selector: soft_policies
mask_before_softmax: true
runner: parallel
target_update_interval_or_tau: 0.05
agent_output_type: pi_logits
learner: ppo_learner
standardise_returns: false
standardise_rewards: true
use_rnn: true
q_nstep: 5
critic_type: cv_critic

epochs: 2
eps_clip: 0.1
